name: Daily Report Bot

on:
  schedule:
    # 日本時間の朝8時 (UTC 23:00) に毎日実行
    - cron: '0 23 * * *'
  # GitHubの画面上から手動で実行できるようにする
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance line-bot-sdk python-dotenv

      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          STOCK_CODE: ${{ secrets.STOCK_CODE }}
        working-directory: tech_and_money
        run: python main/main.py

      - name: Send LINE message on failure
        if: failure()
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
          -d '{
            "to": "${{ secrets.LINE_USER_ID }}",
            "messages": [{
              "type": "text",
              "text": "⚠️ GitHub Actionsの定期実行が失敗しました。エラーログを確認してください。"
            }]
          }'