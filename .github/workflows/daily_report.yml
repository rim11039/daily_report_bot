name: Daily Report Bot

on:
  schedule:
    # 日本時間の朝6時半 (UTC 21:30) に毎日実行
    - cron: '30 21 * * *'
  # GitHubの画面上から手動で実行できるようにする
  workflow_dispatch:

# GITHUB_TOKEN は使わないため、すべての権限を外しておく
permissions: {}

jobs:
  notion-task-bot:
    runs-on: ubuntu-latest

    steps:
      # タグは後から付け替えられるため、アクションはコミットSHAで固定する
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r notion_task/requirements.txt

      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        working-directory: notion_task
        run: python main/main.py

      # Secretsはスクリプトに直接埋め込まず、環境変数経由で渡す
      - name: Send LINE message on failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
          -d '{
            "to": "'"$LINE_USER_ID"'",
            "messages": [{
              "type": "text",
              "text": "⚠️ Notionタスクbotの実行が失敗しました。エラーログを確認してください。"
            }]
          }'

  qiita-summary-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r qiita_summary/requirements.txt

      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          QIITA_SUMMARY_DATABASE_ID: ${{ secrets.QIITA_SUMMARY_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: qiita_summary
        run: python main/main.py

      - name: Send LINE message on failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
          -d '{
            "to": "'"$LINE_USER_ID"'",
            "messages": [{
              "type": "text",
              "text": "⚠️ Qiita要約botの実行が失敗しました。エラーログを確認してください。"
            }]
          }'
